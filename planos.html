<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinar / Renovar — TV Fun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <style>
    body { background: var(--bg); }
    .sub-wrap { max-width: 520px; margin: 0 auto; padding: 56px 22px 80px; text-align: center; }
    .sub-ic { font-size: 50px; margin-bottom: 14px; }
    .sub-wrap h1 { font-size: 25px; font-weight: 900; margin-bottom: 10px; line-height: 1.25; }
    .sub-wrap p { color: var(--gray2); font-size: 15.5px; line-height: 1.65; margin-bottom: 26px; }
    .sub-actions { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 0 auto; }
    .sub-btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 14px 20px; border-radius: 12px; font-weight: 800; font-size: 15px; text-decoration: none; cursor: pointer; border: 0; transition: filter .15s; }
    .sub-btn.wa { background: #25D366; color: #053d23; }
    .sub-btn.ghost { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); color: #fff; }
    .sub-btn:hover { filter: brightness(1.08); }
    .sub-status { margin-top: 24px; font-size: 13.5px; color: var(--gray); }
  </style>
</head>
<body>

  <nav class="auth-nav">
    <span class="auth-nav-logo">TV FUN</span>
    <div class="auth-nav-right">
      <span id="navUserName" style="color:var(--gray2)"></span>
      <a href="index.html">← App</a>
      <a href="#" id="navLogout">Sair</a>
    </div>
  </nav>

  <div class="sub-wrap">
    <div class="sub-ic">🎬</div>
    <h1>Assine ou renove o seu acesso</h1>
    <p>Para ativar um novo acesso ou renovar o atual, é só falar com o nosso atendimento — a gente te ajuda na hora.</p>
    <div class="sub-actions">
      <a class="sub-btn wa" id="btnContato" href="#" target="_blank" rel="noopener">Falar com o atendimento</a>
      <a class="sub-btn ghost" href="index.html">Voltar para o app</a>
    </div>
    <p class="sub-status" id="planoStatus"></p>
  </div>

  <script>
    (function () {
      // ⚙️ WhatsApp do atendimento — coloque o número real (formato internacional, só dígitos). Vazio = usa e-mail.
      var WHATSAPP = '';                 // ex.: '5511999999999'
      var EMAIL = 'contato@tvfun.com.br';
      var MSG = 'Olá! Quero assinar/renovar meu acesso ao TV Fun.';

      var btn = document.getElementById('btnContato');
      if (WHATSAPP) {
        btn.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(MSG);
        btn.classList.add('wa');
        btn.textContent = 'Falar no WhatsApp';
      } else {
        btn.href = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent('Assinar/Renovar TV Fun');
      }

      if (typeof TVFunDB !== 'undefined') {
        if (TVFunDB.getUser) TVFunDB.getUser().then(function (u) {
          if (u) document.getElementById('navUserName').textContent = u.email;
        }).catch(function () {});

        // Mostra só a VALIDADE atual do acesso (sem preço)
        if (TVFunDB.getActiveCredentials) TVFunDB.getActiveCredentials().then(function (c) {
          if (c && c.expires_at) {
            var d = new Date(c.expires_at).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
            document.getElementById('planoStatus').textContent = 'Seu acesso atual é válido até ' + d + '.';
          }
        }).catch(function () {});

        var lo = document.getElementById('navLogout');
        if (lo) lo.addEventListener('click', function (e) { e.preventDefault(); if (TVFunDB.signOut) TVFunDB.signOut(); });
      }
    })();
  </script>
</body>
</html>
